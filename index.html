<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Administración de Boda - Planifica tu Gran Día</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #fef9e8 0%, #f7e9d7 100%);
            min-height: 100vh;
            color: #3a2c29;
            padding: 20px;
        }

        /* Contenedor principal */
        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Tarjetas */
        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.02);
            padding: 24px 28px;
            margin-bottom: 28px;
            transition: all 0.2s;
        }

        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #b9573a, #d48d6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        button {
            background: #d48d6b;
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        button:hover {
            background: #b9573a;
            transform: scale(0.97);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #d48d6b;
            color: #b9573a;
        }

        .btn-outline:hover {
            background: #fef3e9;
        }

        .btn-danger {
            background: #c95a5a;
        }
        .btn-danger:hover {
            background: #a13e3e;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1.5px solid #f0dfcf;
            border-radius: 40px;
            font-size: 0.9rem;
            background: #fefaf5;
            transition: 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #d48d6b;
            box-shadow: 0 0 0 3px rgba(212,141,107,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            overflow-x: auto;
            display: block;
        }

        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid #f0e2d6;
        }

        th {
            color: #8b5a42;
            font-weight: 600;
        }

        .badge {
            background: #f3e1d4;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #b9573a;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }

        @media (max-width: 780px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 18px;
            }
        }

        .login-box {
            max-width: 450px;
            margin: 80px auto;
            text-align: center;
        }

        .itinerary-item {
            background: #fef7f0;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .time {
            font-weight: 700;
            color: #b9573a;
            min-width: 80px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .stats {
            background: #f9ede3;
            border-radius: 32px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: #b48c72;
        }
    </style>
</head>
<body>
<div class="app-container" id="appRoot">
    <!-- Pantalla de login dinámica -->
</div>

<script>
    // ---------- CONFIGURACIÓN ----------
    // Usamos localStorage como base de datos (simula "gipgup")
    const DB_KEYS = {
        USERS: 'wedding_users',
        GUESTS: 'wedding_guests',
        ITINERARY: 'wedding_itinerary'
    };

    // Credenciales demo (solo para inicio rápido)
    // usuario: admin@boda.com / contraseña: boda2025
    function initDatabase() {
        if (!localStorage.getItem(DB_KEYS.USERS)) {
            const defaultUsers = [
                { email: "admin@boda.com", password: "boda2025", name: "Administrador" }
            ];
            localStorage.setItem(DB_KEYS.USERS, JSON.stringify(defaultUsers));
        }
        if (!localStorage.getItem(DB_KEYS.GUESTS)) {
            localStorage.setItem(DB_KEYS.GUESTS, JSON.stringify([]));
        }
        if (!localStorage.getItem(DB_KEYS.ITINERARY)) {
            const defaultItinerary = [
                { id: "1", time: "11:00 AM", title: "Ceremonia Religiosa", location: "Iglesia del Pueblo", description: "Llegar con 15 min de anticipación" },
                { id: "2", time: "1:00 PM", title: "Coctel de Bienvenida", location: "Jardín del Salón", description: "Brindis y música ambiental" },
                { id: "3", time: "3:00 PM", title: "Banquete", location: "Salón Principal", description: "Comida de 3 tiempos" },
                { id: "4", time: "5:00 PM", title: "Baile y Pastel", location: "Pista de baile", description: "Tradicional vals y sorpresas" }
            ];
            localStorage.setItem(DB_KEYS.ITINERARY, JSON.stringify(defaultItinerary));
        }
    }

    // Estado global
    let currentUser = null;

    // Helper: leer/guardar invitados
    function getGuests() {
        return JSON.parse(localStorage.getItem(DB_KEYS.GUESTS)) || [];
    }
    function saveGuests(guests) {
        localStorage.setItem(DB_KEYS.GUESTS, JSON.stringify(guests));
    }
    function getItinerary() {
        return JSON.parse(localStorage.getItem(DB_KEYS.ITINERARY)) || [];
    }
    function saveItinerary(itinerary) {
        localStorage.setItem(DB_KEYS.ITINERARY, JSON.stringify(itinerary));
    }

    // ---------- TRES PREGUNTAS (simulacro de configuración) ----------
    // Se mostrarán al iniciar sesión por primera vez o cuando se llame a "mostrarPreguntas"
    // Las respuestas se guardan en localStorage para no repetir, pero las preguntas son parte del flujo.
    function hacerTresPreguntas() {
        const yaRespondio = localStorage.getItem('wedding_questions_answered');
        if (yaRespondio === 'true') return Promise.resolve(true);

        return new Promise((resolve) => {
            // Preguntas con respuestas estilo alert, pero mejor usamos modal con prompt custom
            // Se puede hacer con confirm moderno pero usaremos prompts secuenciales para simplicidad y funcionalidad.
            const pregunta1 = prompt("❓ PREGUNTA 1/3 - Organización:\n¿Cuál es el color principal de la decoración de tu boda? (ejemplo: 'Rosa pastel', 'Verde esmeralda')");
            const pregunta2 = prompt("❓ PREGUNTA 2/3 - Invitados:\n¿Cuántas mesas aproximadas tendrá el salón? (número)");
            const pregunta3 = prompt("❓ PREGUNTA 3/3 - Música:\n¿Canción favorita para el primer baile?");
            
            // Guardamos respuestas en 'db' como dato curioso
            const respuestas = {
                fecha: new Date().toISOString(),
                colorDecoracion: pregunta1 || "No especificado",
                numeroMesas: pregunta2 || "No especificado",
                cancionPrimerBaile: pregunta3 || "No especificado"
            };
            localStorage.setItem('wedding_answers', JSON.stringify(respuestas));
            localStorage.setItem('wedding_questions_answered', 'true');
            alert("¡Gracias! Tus respuestas han sido guardadas. Puedes verlas más tarde en la consola o sección de info.");
            resolve(true);
        });
    }

    // ----- AUTENTICACIÓN -----
    function login(email, password) {
        const users = JSON.parse(localStorage.getItem(DB_KEYS.USERS)) || [];
        const user = users.find(u => u.email === email && u.password === password);
        if (user) {
            currentUser = { email: user.email, name: user.name };
            localStorage.setItem('wedding_current_session', JSON.stringify(currentUser));
            renderApp();
            // Al hacer login por primera vez (si no ha respondido) lanzamos preguntas
            const yaPreguntas = localStorage.getItem('wedding_questions_answered');
            if (!yaPreguntas) {
                hacerTresPreguntas().then(() => renderApp());
            } else {
                renderApp();
            }
            return true;
        }
        return false;
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('wedding_current_session');
        renderApp();
    }

    // Verificar sesión existente
    function checkSession() {
        const stored = localStorage.getItem('wedding_current_session');
        if (stored) {
            currentUser = JSON.parse(stored);
        } else {
            currentUser = null;
        }
        renderApp();
    }

    // ---- CRUD INVITADOS (iglesia / salon) ----
    function agregarInvitado(nombre, tipo, asistenciaConfirmada = false) {
        // tipo: 'iglesia' o 'salon'
        if (!nombre.trim()) return false;
        const guests = getGuests();
        const newId = Date.now().toString();
        guests.push({
            id: newId,
            nombre: nombre.trim(),
            tipo: tipo,      // 'iglesia' o 'salon'
            confirmado: asistenciaConfirmada,
            createdAt: new Date().toISOString()
        });
        saveGuests(guests);
        return true;
    }

    function toggleConfirmacion(id) {
        const guests = getGuests();
        const guest = guests.find(g => g.id === id);
        if (guest) {
            guest.confirmado = !guest.confirmado;
            saveGuests(guests);
        }
        renderApp();
    }

    function eliminarInvitado(id) {
        let guests = getGuests();
        guests = guests.filter(g => g.id !== id);
        saveGuests(guests);
        renderApp();
    }

    // ---- ITINERARIO (nuevo, editar, eliminar) ----
    function agregarEventoItinerario(time, title, location, description) {
        if (!time.trim() || !title.trim()) return false;
        const itinerary = getItinerary();
        const newId = Date.now().toString();
        itinerary.push({ id: newId, time, title, location, description });
        saveItinerary(itinerary);
        renderApp();
        return true;
    }

    function eliminarEventoItinerario(id) {
        let itinerary = getItinerary();
        itinerary = itinerary.filter(ev => ev.id !== id);
        saveItinerary(itinerary);
        renderApp();
    }

    function actualizarEventoItinerario(id, time, title, location, description) {
        const itinerary = getItinerary();
        const index = itinerary.findIndex(ev => ev.id === id);
        if (index !== -1) {
            itinerary[index] = { ...itinerary[index], time, title, location, description };
            saveItinerary(itinerary);
            renderApp();
        }
    }

    // ---- UI RENDER (enfoque total) ----
    function renderApp() {
        const root = document.getElementById('appRoot');
        if (!root) return;

        if (!currentUser) {
            // Pantalla login
            root.innerHTML = `
                <div class="login-box card">
                    <div class="logo" style="justify-content:center;">
                        <h1>💍 Planifica tu Boda</h1>
                    </div>
                    <p style="margin-bottom: 20px;">Accede al panel de administración de invitados e itinerarios.</p>
                    <input type="email" id="loginEmail" placeholder="Email" value="admin@boda.com">
                    <input type="password" id="loginPassword" placeholder="Contraseña" value="boda2025">
                    <button id="doLoginBtn" style="width:100%;">Iniciar Sesión</button>
                    <p style="margin-top: 20px; font-size:0.8rem;">Demo: admin@boda.com / boda2025</p>
                </div>
            `;
            document.getElementById('doLoginBtn')?.addEventListener('click', () => {
                const email = document.getElementById('loginEmail').value;
                const pwd = document.getElementById('loginPassword').value;
                if (!login(email, pwd)) {
                    alert("Credenciales incorrectas. Usa admin@boda.com / boda2025");
                }
            });
            return;
        }

        // ======= PANEL PRINCIPAL ========
        const guests = getGuests();
        const itinerarios = getItinerary();
        
        // Filtrar invitados por tipo
        const invitadosIglesia = guests.filter(g => g.tipo === 'iglesia');
        const invitadosSalon = guests.filter(g => g.tipo === 'salon');
        
        const totalIglesia = invitadosIglesia.length;
        const confirmadosIglesia = invitadosIglesia.filter(g => g.confirmado).length;
        const totalSalon = invitadosSalon.length;
        const confirmadosSalon = invitadosSalon.filter(g => g.confirmado).length;

        // Obtener respuestas curiosas si existen
        const respuestas = JSON.parse(localStorage.getItem('wedding_answers') || '{}');
        const muestraPregunta = respuestas.colorDecoracion ? `🎨 Decoración: ${respuestas.colorDecoracion} | 🕺 Canción: ${respuestas.cancionPrimerBaile || '—'}` : 'Responde las 3 preguntas para personalizar';

        root.innerHTML = `
            <div class="app-container">
                <div class="logo">
                    <h1>✨ Mi Boda - Panel Administrador ✨</h1>
                    <div>
                        <span class="badge">${currentUser.email}</span>
                        <button id="logoutBtn" class="btn-outline" style="margin-left:12px;">Cerrar sesión</button>
                    </div>
                </div>
                
                <div class="stats card">
                    <div><strong>💒 Iglesia</strong><br>${totalIglesia} invitados · ${confirmadosIglesia} confirmados</div>
                    <div><strong>🍾 Salón/Fiesta</strong><br>${totalSalon} invitados · ${confirmadosSalon} confirmados</div>
                    <div><strong>📋 Itinerario</strong><br>${itinerarios.length} actividades</div>
                    <div><small>${muestraPregunta}</small></div>
                </div>

                <div class="grid-2">
                    <!-- COLUMNA IZQUIERDA: Gestión invitados -->
                    <div class="card">
                        <h2>📝 Gestión de Invitados</h2>
                        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
                            <input type="text" id="newGuestName" placeholder="Nombre completo" style="flex:2;">
                            <select id="newGuestType" style="flex:1;">
                                <option value="iglesia">Iglesia</option>
                                <option value="salon">Salón / Fiesta</option>
                            </select>
                            <button id="addGuestBtn">➕ Añadir</button>
                        </div>
                        <div style="overflow-x:auto;">
                            <table>
                                <thead>
                                    <tr><th>Nombre</th><th>Tipo</th><th>Confirmado</th><th>Acciones</th></tr>
                                </thead>
                                <tbody id="guestsTableBody">
                                    ${guests.map(guest => `
                                        <tr>
                                            <td>${escapeHtml(guest.nombre)}</td>
                                            <td>${guest.tipo === 'iglesia' ? '⛪ Iglesia' : '🎉 Salón'}</td>
                                            <td>${guest.confirmado ? '✅ Sí Asiste' : '⏳ Pendiente'}</td>
                                            <td>
                                                <button class="toggle-confirm" data-id="${guest.id}" style="background:#6c8b6e; padding:5px 12px;">✉️ Confirmar</button>
                                                <button class="delete-guest" data-id="${guest.id}" style="background:#c95a5a; padding:5px 12px;">🗑️</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                    ${guests.length === 0 ? '<tr><td colspan="4">Sin invitados aún. ¡Agrega el primero!</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- COLUMNA DERECHA: Itinerarios + preguntas dinámicas -->
                    <div class="card">
                        <h2>⏰ Itinerario del día</h2>
                        <div id="itineraryList">
                            ${itinerarios.map(ev => `
                                <div class="itinerary-item" data-id="${ev.id}">
                                    <div style="flex:3;">
                                        <span class="time">${escapeHtml(ev.time)}</span>
                                        <strong>${escapeHtml(ev.title)}</strong><br>
                                        <small>📍 ${escapeHtml(ev.location)}</small>
                                        <p style="font-size:0.8rem;">${escapeHtml(ev.description)}</p>
                                    </div>
                                    <div class="action-buttons">
                                        <button class="edit-itinerary" data-id="${ev.id}">✏️ Editar</button>
                                        <button class="delete-itinerary" data-id="${ev.id}" style="background:#c95a5a;">🗑️</button>
                                    </div>
                                </div>
                            `).join('')}
                            ${itinerarios.length === 0 ? '<p>No hay eventos, crea uno nuevo.</p>' : ''}
                        </div>
                        <hr style="margin: 20px 0;">
                        <h3>➕ Nuevo evento</h3>
                        <input type="text" id="newEventTime" placeholder="Hora (ej: 10:00 AM)">
                        <input type="text" id="newEventTitle" placeholder="Título (ej: Llegada novios)">
                        <input type="text" id="newEventLocation" placeholder="Ubicación">
                        <textarea id="newEventDesc" rows="2" placeholder="Descripción"></textarea>
                        <button id="addEventBtn">Añadir al Itinerario</button>
                    </div>
                </div>

                <div class="card">
                    <h3>📊 Reporte rápido</h3>
                    <button id="exportDataBtn" class="btn-outline">📎 Exportar datos (JSON) - gipgup compatible</button>
                    <button id="importDataBtn" class="btn-outline" style="margin-left:12px;">📂 Importar respaldo</button>
                    <input type="file" id="importFileInput" accept=".json" style="display:none;">
                    <p style="margin-top:12px; font-size:0.75rem;">* La base de datos se guarda en localStorage (simula gipgup) - exporta para respaldo físico.</p>
                </div>
                <footer>💖 Administrador de Boda - Organiza invitados, iglesia, salón e itinerarios con estilo</footer>
            </div>
        `;

        // Eventos
        document.getElementById('logoutBtn')?.addEventListener('click', logout);
        document.getElementById('addGuestBtn')?.addEventListener('click', () => {
            const nombre = document.getElementById('newGuestName').value;
            const tipo = document.getElementById('newGuestType').value;
            if (!nombre.trim()) return alert("Escribe un nombre");
            agregarInvitado(nombre, tipo);
            document.getElementById('newGuestName').value = '';
        });

        // botones dinámicos confirmar/eliminar invitados
        document.querySelectorAll('.toggle-confirm').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = btn.getAttribute('data-id');
                toggleConfirmacion(id);
            });
        });
        document.querySelectorAll('.delete-guest').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(confirm("¿Eliminar este invitado?")) eliminarInvitado(btn.getAttribute('data-id'));
            });
        });

        // Itinerario: eliminar
        document.querySelectorAll('.delete-itinerary').forEach(btn => {
            btn.addEventListener('click', () => {
                if(confirm("Eliminar evento del itinerario")) eliminarEventoItinerario(btn.getAttribute('data-id'));
            });
        });
        // Editar itinerario (simple prompt mejorable)
        document.querySelectorAll('.edit-itinerary').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.getAttribute('data-id');
                const evento = itinerarios.find(ev => ev.id === id);
                if(evento) {
                    const newTime = prompt("Editar hora:", evento.time);
                    const newTitle = prompt("Editar título:", evento.title);
                    const newLoc = prompt("Editar ubicación:", evento.location);
                    const newDesc = prompt("Editar descripción:", evento.description);
                    if(newTime && newTitle) actualizarEventoItinerario(id, newTime, newTitle, newLoc || "", newDesc || "");
                }
            });
        });

        document.getElementById('addEventBtn')?.addEventListener('click', () => {
            const time = document.getElementById('newEventTime').value;
            const title = document.getElementById('newEventTitle').value;
            const loc = document.getElementById('newEventLocation').value;
            const desc = document.getElementById('newEventDesc').value;
            if(!time || !title) return alert("Hora y título requeridos");
            agregarEventoItinerario(time, title, loc, desc);
            document.getElementById('newEventTime').value = '';
            document.getElementById('newEventTitle').value = '';
            document.getElementById('newEventLocation').value = '';
            document.getElementById('newEventDesc').value = '';
        });

        // Exportar completo (invitados + itinerario + respuestas)
        document.getElementById('exportDataBtn')?.addEventListener('click', () => {
            const exportData = {
                guests: getGuests(),
                itinerary: getItinerary(),
                weddingAnswers: JSON.parse(localStorage.getItem('wedding_answers') || '{}'),
                exportDate: new Date().toISOString()
            };
            const dataStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `boda_backup_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Importar backup
        const importBtn = document.getElementById('importDataBtn');
        const fileInput = document.getElementById('importFileInput');
        importBtn?.addEventListener('click', () => fileInput.click());
        fileInput?.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if(data.guests) saveGuests(data.guests);
                    if(data.itinerary) saveItinerary(data.itinerary);
                    if(data.weddingAnswers) localStorage.setItem('wedding_answers', JSON.stringify(data.weddingAnswers));
                    alert("Restauración exitosa. Recarga la vista.");
                    renderApp();
                } catch(e) { alert("Archivo inválido"); }
            };
            reader.readAsText(file);
            fileInput.value = '';
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Arranque
    initDatabase();
    checkSession();
</script>
</body>
</html>
