<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Shower - Libro de Predicciones del Mar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Incluir Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
    <style>
        /* ... (todos los estilos anteriores se mantienen igual) ... */
    </style>
</head>
<body>
    <div class="ocean-bg">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    
    <div class="container">
        <!-- ... (todo el HTML anterior se mantiene igual) ... -->
    </div>

    <script>
        // Variables globales
        let predictions = [];
        let selectedGender = null;
        let supabaseClient = null;
        let isConnected = false;
        
        // Configuración de Supabase - Asegúrate de usar tus datos REALES aquí
        const SUPABASE_URL = 'https://fndskmqdvmndwiwjewwx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuZHNrbXFkdm1uZHdpd2p3ZXd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDk5MDQsImV4cCI6MjA4NTI4NTkwNH0.7cTUi4jb1eGYuCE8YVuUZi1dozTGRufWkVR-sHZAM88';
        
        // Cargar predicciones guardadas al iniciar
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 Iniciando aplicación...');
            
            // Inicializar Supabase con verificación detallada
            await initializeSupabase();
            
            // Cargar predicciones
            await loadPredictions();
            
            // Iniciar cuenta regresiva
            updateCountdown();
            setInterval(updateCountdown, 1000);
            
            // Mostrar mensaje de bienvenida
            setTimeout(() => {
                showStatus('¡Bienvenidos al libro de predicciones del baby shower! 🐠', 'success');
            }, 1000);
        });
        
        // Inicializar Supabase con diagnóstico detallado
        async function initializeSupabase() {
            try {
                console.log('🔄 Inicializando conexión con Supabase...');
                console.log('🔗 URL:', SUPABASE_URL);
                console.log('🔑 Key:', SUPABASE_ANON_KEY ? 'Presente' : 'Faltante');
                
                // Verificar que Supabase esté disponible
                if (typeof supabase === 'undefined') {
                    console.error('❌ Supabase no está disponible en el objeto global');
                    throw new Error('Supabase no está disponible');
                }
                
                console.log('✅ Supabase cargado correctamente');
                
                // Crear cliente Supabase
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true
                    },
                    db: {
                        schema: 'public'
                    },
                    global: {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY
                        }
                    }
                });
                
                console.log('✅ Cliente Supabase creado');
                
                // Probar conexión con timeout
                const connectionPromise = supabaseClient
                    .from('predictions')
                    .select('count', { count: 'exact', head: true });
                
                // Timeout de 10 segundos
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('Timeout: La conexión tardó demasiado')), 10000)
                );
                
                const { data, error } = await Promise.race([connectionPromise, timeoutPromise]);
                
                if (error) {
                    console.error('❌ Error de conexión a Supabase:', error);
                    throw error;
                }
                
                isConnected = true;
                console.log('✅ Conectado a Supabase correctamente');
                console.log('📊 Total de registros en base de datos:', data?.count || 0);
                showStatus('✅ Conectado a la base de datos de forma segura', 'success');
                
                // Verificar estructura de la tabla
                await checkTableStructure();
                
            } catch (error) {
                console.error('❌ Error crítico al conectar con Supabase:', error);
                console.error('🔍 Detalles del error:', {
                    message: error.message,
                    name: error.name,
                    stack: error.stack
                });
                
                isConnected = false;
                showStatus(`⚠️ Error de conexión: ${error.message}. Usando almacenamiento local como respaldo`, 'error');
                
                // Cargar de localStorage como respaldo
                loadFromLocalStorage();
                
                // Mostrar sugerencias para solucionar el problema
                showConnectionTroubleshooting();
            }
        }
        
        // Verificar estructura de la tabla
        async function checkTableStructure() {
            try {
                const { data, error } = await supabaseClient
                    .from('predictions')
                    .select('*')
                    .limit(1);
                
                if (error) throw error;
                
                console.log('✅ Estructura de tabla verificada');
                console.log('📋 Columnas disponibles:', data.length > 0 ? Object.keys(data[0]) : 'Tabla vacía');
                
            } catch (error) {
                console.warn('⚠️ No se pudo verificar la estructura de la tabla:', error.message);
            }
        }
        
        // Mostrar guía de solución de problemas
        function showConnectionTroubleshooting() {
            const troubleshooting = `
                <div style="background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 5px; padding: 15px; margin: 15px 0; color: #856404;">
                    <h3 style="margin-top: 0;">🔧 Solución de problemas de conexión:</h3>
                    <ol style="margin-bottom: 0;">
                        <li>Verifica que tu proyecto Supabase esté activo</li>
                        <li>Asegúrate de que la tabla "predictions" exista en la base de datos</li>
                        <li>Verifica que la tabla tenga las columnas: id, name, gender, created_at</li>
                        <li>Comprueba los permisos de la política RLS (Row Level Security)</li>
                        <li>Los datos se guardarán localmente hasta que se restablezca la conexión</li>
                    </ol>
                </div>
            `;
            
            // Insertar después del header
            const header = document.querySelector('header');
            if (header) {
                header.insertAdjacentHTML('afterend', troubleshooting);
            }
        }
        
        // Cuenta regresiva
        function updateCountdown() {
            const eventDate = new Date('March 15, 2026 16:00:00').getTime();
            const now = new Date().getTime();
            const timeLeft = eventDate - now;
            
            if (timeLeft > 0) {
                const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                
                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            } else {
                document.getElementById('countdown').innerHTML = '<div class="date-details">¡El evento está en curso!</div>';
            }
        }
        
        // Seleccionar género
        const genderButtons = document.querySelectorAll('.gender-btn');
        genderButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remover selección anterior
                genderButtons.forEach(btn => btn.classList.remove('selected'));
                
                // Seleccionar actual
                this.classList.add('selected');
                selectedGender = this.getAttribute('data-gender');
                document.getElementById('selectedGender').value = selectedGender;
                
                // Efecto visual
                this.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 300);
            });
        });
        
        // Manejar envío del formulario
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nameInput = document.getElementById('guestName');
            const guestName = nameInput.value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            if (!guestName) {
                showStatus('Por favor, escribe tu nombre', 'error');
                nameInput.focus();
                return;
            }
            
            if (!selectedGender) {
                showStatus('Por favor, selecciona si crees que será niño o niña', 'error');
                return;
            }
            
            // Crear nueva predicción
            const newPrediction = {
                name: guestName,
                gender: selectedGender,
                date: new Date().toLocaleDateString('es-ES', {
                    day: 'numeric',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit'
                }),
                created_at: new Date().toISOString(),
                expires_at: new Date(Date.now() + 90 * 24 * 60 * 60 * 1000).toISOString() // 90 días desde ahora
            };
            
            console.log('📝 Enviando nueva predicción:', newPrediction);
            
            // Deshabilitar botón mientras se procesa
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading"></div><span>Enviando...</span>';
            
            try {
                if (isConnected && supabaseClient) {
                    console.log('🌐 Intentando guardar en Supabase...');
                    
                    // Guardar en Supabase
                    const { data, error } = await supabaseClient
                        .from('predictions')
                        .insert([newPrediction])
                        .select();
                    
                    if (error) {
                        console.error('❌ Error de Supabase:', error);
                        throw error;
                    }
                    
                    console.log('✅ Guardado en Supabase exitoso:', data);
                    
                    // Agregar a la lista local con el ID generado por Supabase
                    predictions.unshift({...newPrediction, id: data[0].id});
                    
                    showStatus('✅ Predicción guardada en la base de datos por 90 días', 'success');
                } else {
                    console.log('💾 Guardando localmente (modo offline)');
                    
                    // Guardar en localStorage (modo offline)
                    newPrediction.id = Date.now();
                    predictions.unshift(newPrediction);
                    saveToLocalStorage();
                    
                    showStatus('✅ Predicción guardada localmente. Se sincronizará cuando haya conexión', 'error');
                }
                
                // Actualizar la UI
                renderPredictions();
                updateStats();
                
                // Limpiar formulario
                nameInput.value = '';
                genderButtons.forEach(btn => btn.classList.remove('selected'));
                selectedGender = null;
                document.getElementById('selectedGender').value = '';
                
                // Efecto visual de éxito
                submitBtn.innerHTML = '<i class="fas fa-check"></i><span>¡Enviado!</span>';
                submitBtn.style.background = 'linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%)';
                
                setTimeout(() => {
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i><span>Enviar predicción</span>';
                    submitBtn.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #ff8ab0 100%)';
                    submitBtn.disabled = false;
                }, 1500);
                
                // Mostrar mensaje de agradecimiento
                const genderText = selectedGender === 'boy' ? 'niño 👶💙' : 'niña 👶💖';
                showStatus(`¡Gracias ${guestName} por tu predicción! Has dicho que será ${genderText}`, 'success');
                
            } catch (error) {
                console.error('❌ Error al guardar la predicción:', error);
                
                // Mostrar error detallado
                let errorMessage = 'Error al guardar. ';
                if (error.code === '42501') {
                    errorMessage += 'Error de permisos. Verifica las políticas RLS en Supabase.';
                } else if (error.code === '42P01') {
                    errorMessage += 'La tabla "predictions" no existe. Créala en Supabase.';
                } else {
                    errorMessage += error.message;
                }
                
                showStatus(errorMessage, 'error');
                
                // Intentar guardar localmente como respaldo
                try {
                    newPrediction.id = Date.now();
                    predictions.unshift(newPrediction);
                    saveToLocalStorage();
                    
                    renderPredictions();
                    updateStats();
                    
                    submitBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>Guardado localmente</span>';
                    submitBtn.style.background = 'linear-gradient(135deg, #ff9800 0%, #ffb74d 100%)';
                    
                    setTimeout(() => {
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i><span>Enviar predicción</span>';
                        submitBtn.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #ff8ab0 100%)';
                        submitBtn.disabled = false;
                    }, 2000);
                    
                } catch (localError) {
                    showStatus('Hubo un error al guardar tu predicción. Por favor, intenta de nuevo.', 'error');
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i><span>Enviar predicción</span>';
                    submitBtn.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #ff8ab0 100%)';
                    submitBtn.disabled = false;
                }
            }
        });
        
        // Cargar predicciones desde Supabase
        async function loadPredictions() {
            console.log('📥 Cargando predicciones...');
            
            try {
                if (isConnected && supabaseClient) {
                    console.log('🌐 Cargando desde Supabase...');
                    
                    const { data, error } = await supabaseClient
                        .from('predictions')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (error) {
                        console.error('❌ Error al cargar desde Supabase:', error);
                        throw error;
                    }
                    
                    predictions = data || [];
                    console.log(`✅ Cargadas ${predictions.length} predicciones desde Supabase`);
                    
                    // Sincronizar con localStorage
                    saveToLocalStorage();
                    
                    renderPredictions();
                    updateStats();
                    
                } else {
                    console.log('💾 Cargando desde localStorage...');
                    loadFromLocalStorage();
                }
            } catch (error) {
                console.error('❌ Error al cargar predicciones:', error);
                loadFromLocalStorage();
            }
        }
        
        // Guardar en localStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem('babyShowerPredictions', JSON.stringify(predictions));
                localStorage.setItem('babyShowerLastSync', new Date().toISOString());
                console.log('💾 Guardado en localStorage:', predictions.length, 'predicciones');
            } catch (error) {
                console.error('Error al guardar en localStorage:', error);
            }
        }
        
        // Cargar desde localStorage
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('babyShowerPredictions');
                if (saved) {
                    predictions = JSON.parse(saved);
                    console.log(`💾 Cargadas ${predictions.length} predicciones desde localStorage`);
                    renderPredictions();
                    updateStats();
                    showStatus('📂 Cargado desde almacenamiento local', 'error');
                } else {
                    console.log('💾 No hay predicciones guardadas localmente');
                }
            } catch (error) {
                console.error('Error al cargar de localStorage:', error);
            }
        }
        
        // Mostrar predicciones en la lista
        function renderPredictions() {
            const container = document.getElementById('predictionsContainer');
            const emptyList = document.getElementById('emptyList');
            
            if (predictions.length === 0) {
                emptyList.style.display = 'block';
                emptyList.innerHTML = '<p>¡Sé el primero en dejar tu predicción!</p><p>🐚 ¿Será niño o niña? 🐚</p>';
                return;
            }
            
            emptyList.style.display = 'none';
            
            // Generar HTML para cada predicción
            const predictionsHTML = predictions.map(prediction => `
                <div class="prediction-item" data-id="${prediction.id}">
                    <div class="prediction-header">
                        <div class="prediction-name">${prediction.name}</div>
                        <div class="prediction-gender ${prediction.gender === 'boy' ? 'boy-badge' : 'girl-badge'}">
                            ${prediction.gender === 'boy' ? '👶 Niño' : '👶 Niña'}
                        </div>
                    </div>
                    <div class="prediction-date">
                        <i class="far fa-clock"></i> ${prediction.date}
                        ${!isConnected ? '<span style="color: #ff9800; font-size: 0.8em;"> (local)</span>' : ''}
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = predictionsHTML;
        }
        
        // Actualizar estadísticas
        function updateStats() {
            const boyCount = predictions.filter(p => p.gender === 'boy').length;
            const girlCount = predictions.filter(p => p.gender === 'girl').length;
            const totalCount = predictions.length;
            
            document.getElementById('boyCount').textContent = boyCount;
            document.getElementById('girlCount').textContent = girlCount;
            document.getElementById('totalCount').textContent = totalCount;
        }
        
        // Botón para borrar todas las predicciones
        document.getElementById('deleteAllBtn').addEventListener('click', async function() {
            if (predictions.length === 0) {
                showStatus('No hay predicciones para borrar', 'error');
                return;
            }
            
            if (confirm(`¿Estás seguro de que quieres borrar todas las ${predictions.length} predicciones?\n\nEsta acción no se puede deshacer.`)) {
                try {
                    if (isConnected && supabaseClient) {
                        // Borrar todas las predicciones de Supabase
                        const { error } = await supabaseClient
                            .from('predictions')
                            .delete()
                            .neq('id', 0);
                        
                        if (error) throw error;
                        
                        console.log('🗑️ Todas las predicciones borradas de Supabase');
                    }
                    
                    // Borrar localmente
                    predictions = [];
                    localStorage.removeItem('babyShowerPredictions');
                    renderPredictions();
                    updateStats();
                    
                    showStatus('✅ Todas las predicciones han sido borradas', 'success');
                    
                } catch (error) {
                    console.error('Error al borrar predicciones:', error);
                    showStatus('❌ Error al borrar las predicciones: ' + error.message, 'error');
                }
            }
        });
        
        // Botón de ubicación
        const locationBtn = document.getElementById('locationBtn');
        const locationDetails = document.getElementById('locationDetails');
        
        locationBtn.addEventListener('click', function() {
            if (locationDetails.style.display === 'block') {
                locationDetails.style.display = 'none';
                locationBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i><span>Ver ubicación del evento</span>';
            } else {
                locationDetails.style.display = 'block';
                locationBtn.innerHTML = '<i class="fas fa-times"></i><span>Ocultar ubicación</span>';
                
                // Simular apertura de Google Maps
                setTimeout(() => {
                    alert('📍 Ubicación: Salón Azul Marino\nAvenida del Océano, 123\nZona Costera, Ciudad\n\n(En una página real, esto abriría Google Maps con la ubicación exacta)');
                }, 300);
            }
        });
        
        // Mostrar mensajes de estado
        function showStatus(message, type = 'success') {
            const statusElement = document.getElementById('statusMessage');
            statusElement.textContent = message;
            statusElement.className = `status-message status-${type}`;
            statusElement.style.display = 'block';
            
            // Ocultar después de 5 segundos
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 5000);
        }
        
        // Efecto decorativo para elementos marinos
        const marineItems = document.querySelectorAll('.marine-item');
        marineItems.forEach(item => {
            item.addEventListener('mouseover', function() {
                this.style.transform = 'scale(1.2)';
            });
            
            item.addEventListener('mouseout', function() {
                this.style.transform = '';
            });
        });
        
        // Sincronizar automáticamente cada 30 segundos si hay conexión
        setInterval(async () => {
            if (isConnected && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('predictions')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (!error && data) {
                        predictions = data;
                        renderPredictions();
                        updateStats();
                        saveToLocalStorage();
                        console.log('🔄 Sincronización automática completada');
                    }
                } catch (error) {
                    console.log('❌ Error en sincronización automática:', error);
                }
            }
        }, 30000); // 30 segundos
        
        // Intentar reconectar cada minuto si no hay conexión
        setInterval(async () => {
            if (!isConnected) {
                console.log('🔄 Intentando reconexión...');
                await initializeSupabase();
                if (isConnected) {
                    await loadPredictions();
                }
            }
        }, 60000); // 60 segundos
        
        // Función para limpiar predicciones antiguas (más de 90 días)
        async function cleanOldPredictions() {
            try {
                if (isConnected && supabaseClient) {
                    const ninetyDaysAgo = new Date(Date.now() - 90 * 24 * 60 * 60 * 1000).toISOString();
                    
                    const { error } = await supabaseClient
                        .from('predictions')
                        .delete()
                        .lt('created_at', ninetyDaysAgo);
                    
                    if (!error) {
                        console.log('🧹 Predicciones antiguas limpiadas');
                    }
                }
            } catch (error) {
                console.error('Error al limpiar predicciones antiguas:', error);
            }
        }
        
        // Ejecutar limpieza al cargar y luego cada día
        setTimeout(cleanOldPredictions, 5000);
        setInterval(cleanOldPredictions, 24 * 60 * 60 * 1000); // Cada 24 horas
    </script>
</body>
</html>
